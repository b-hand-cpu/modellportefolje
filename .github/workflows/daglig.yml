name: Daglig oppdatering

on:
  schedule:
    - cron: "0 16 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  oppdater:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install pandas yfinance

      - run: python scripts/oppdater.py

      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/performance.csv data/per_aksje.csv
          git diff --staged --quiet || git commit -m "Daglig oppdatering $(date -u +%Y-%m-%d)"
          git push
